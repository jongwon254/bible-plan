<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성경읽기 체크리스트</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="checklistSection">
    <header>
      <button id="prevBtn" class="nav-btn" aria-label="이전 날">‹</button>
      <div class="date-block">
        <select id="weekSelect" class="week-select"></select>
        <div id="dateLabel" class="date-label">-</div>
        <button id="todayBtn" class="today-btn">오늘</button>
      </div>
      <button id="nextBtn" class="nav-btn" aria-label="다음 날">›</button>
    </header>

    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <div id="progressText" class="progress-text">0 / 0</div>
    </div>

    <main id="list"></main>

    <button id="statsBtn" class="stats-link">전체 진행률 보기</button>
    <p id="statusMsg" class="status-msg" hidden></p>
  </div>

  <div id="progressSection" hidden>
    <header class="stats-header">
      <button id="backBtn" class="nav-btn" aria-label="돌아가기">‹</button>
      <div class="date-label">진행률</div>
      <span class="nav-btn" aria-hidden="true" style="visibility:hidden">‹</span>
    </header>
    <div id="statsList"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
